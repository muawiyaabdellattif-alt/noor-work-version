name: Build Noor APK

on:
  push:
    branches: [main]
    paths:
      - noor-android-foundation-v0.38.0.zip
      - .github/workflows/build-noor-apk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noor-v0-38-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - name: Checkout build input
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          yes | sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0" >/dev/null

      - name: Verify and unpack Noor v0.38.0
        shell: bash
        run: |
          set -euo pipefail
          echo "ffbf105c814c86089a8ff14972c6d96b4f2e388c1179c8a3db519f418abed56f  noor-android-foundation-v0.38.0.zip" | sha256sum -c -
          mkdir -p source
          unzip -q noor-android-foundation-v0.38.0.zip -d source
          test -f source/noor-android-foundation-v0.38.0/settings.gradle.kts
          chmod +x source/noor-android-foundation-v0.38.0/gradlew

      - name: Build installable debug APK
        working-directory: source/noor-android-foundation-v0.38.0
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK identity and signature
        working-directory: source/noor-android-foundation-v0.38.0
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          test -s "$APK"
          mkdir -p github-output
          cp "$APK" github-output/Noor-v0.38.0-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs github-output/Noor-v0.38.0-debug.apk | tee github-output/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging github-output/Noor-v0.38.0-debug.apk | tee github-output/APK-BADGING.txt
          sha256sum github-output/Noor-v0.38.0-debug.apk > github-output/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-v0.38.0-debug-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            source/noor-android-foundation-v0.38.0/github-output/Noor-v0.38.0-debug.apk
            source/noor-android-foundation-v0.38.0/github-output/APK-SIGNATURE.txt
            source/noor-android-foundation-v0.38.0/github-output/APK-BADGING.txt
            source/noor-android-foundation-v0.38.0/github-output/SHA256SUMS.txt
