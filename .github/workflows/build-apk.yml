name: Build Noor Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source-package/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct governed source package
        shell: bash
        run: |
          cat source-package/noor-v0.38.0.zip.b64.part-* | base64 --decode > noor-android-foundation-v0.38.0.zip
          echo "ffbf105c814c86089a8ff14972c6d96b4f2e388c1179c8a3db519f418abed56f  noor-android-foundation-v0.38.0.zip" | sha256sum --check -
          unzip -q noor-android-foundation-v0.38.0.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install available Android SDK
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Apply CI compatibility
        working-directory: noor-android-foundation-v0.38.0
        shell: bash
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/g' build-logic/src/main/kotlin/*.gradle.kts macrobenchmark/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/g' build-logic/src/main/kotlin/*.gradle.kts macrobenchmark/build.gradle.kts
          sed -i '/sourceSets.getByName("androidTest").assets.srcDir/d' data/room/build.gradle.kts
          sed -i '/import androidx.datastore.preferences.core.clear/d' data/datastore/src/main/kotlin/com/noor/data/datastore/NoorAudioSessionRepository.kt
          sed -i 's/getWorkInfosForUniqueWork(uniqueWorkName(contentPackage.id)).await()/getWorkInfosForUniqueWorkFlow(uniqueWorkName(contentPackage.id)).first()/' engines/downloads/src/main/kotlin/com/noor/engines/downloads/WorkManagerDownloadEngine.kt
          sed -i 's/import com.batoulapps.adhan.DateComponents/import com.batoulapps.adhan.data.DateComponents/' engines/prayer/src/main/kotlin/com/noor/engines/prayer/AdhanPrayerEngine.kt
          sed -i 's/firstOrNull(ContentPackage::isApprovedMushafPackage)/firstOrNull { it.isApprovedMushafPackage() }/g' data/repositories/src/main/kotlin/com/noor/data/repositories/InstalledMushafPageRepository.kt
          sed -i 's/filter(ContentPackage::isApprovedTranslationPackage)/filter { it.isApprovedTranslationPackage() }/' data/repositories/src/main/kotlin/com/noor/data/repositories/InstalledTranslationEngine.kt
          find features -name '*.kt' -exec sed -i 's/import androidx.compose.foundation.layout.rememberScrollState/import androidx.compose.foundation.rememberScrollState/' {} +
          find features -name '*.kt' -exec sed -i '/import androidx.compose.foundation.layout.weight/d' {} +

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Validate source
        working-directory: noor-android-foundation-v0.38.0
        run: python3 scripts/verify_source_policy.py

      - name: Build debug APK
        working-directory: noor-android-foundation-v0.38.0
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-v0.38.0-debug-apk
          path: noor-android-foundation-v0.38.0/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
